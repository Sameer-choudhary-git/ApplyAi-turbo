version: '3.8'

services:
  # Redis Cache Service (Standalone) - for apps/api caching
  redis:
    image: redis:7-alpine
    container_name: applyai-redis-cache
    ports:
      - "6380:6379"
    volumes:
      - redis_cache_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - applyai-network

  # Redis Queue Service (Standalone) - for apps/worker BullMQ
  redis-queue:
    image: redis:7-alpine
    container_name: applyai-redis-queue
    ports:
      - "6379:6379"
    volumes:
      - redis_queue_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - applyai-network

  # Redis Commander - Web UI for monitoring both
  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: applyai-redis-cache-ui
    depends_on:
      - redis
      - redis-queue
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: cache:redis:6379,queue:redis-queue:6379
    networks:
      - applyai-network
    restart: unless-stopped

volumes:
  redis_cache_data:
    driver: local
  redis_queue_data:
    driver: local

networks:
  applyai-network:
    driver: bridge