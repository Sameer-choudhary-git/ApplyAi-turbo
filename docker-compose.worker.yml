services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: applyai-worker
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1500M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
